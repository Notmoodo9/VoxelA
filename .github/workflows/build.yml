name: Assembly engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm gcc make binutils python3 libsdl2-dev libgl1-mesa-dri xvfb xauth
      - run: make CONFIG=${{ matrix.config }} all test reference abi-reference window packaging-test material-assets-test save-reference
      - run: ./build/linux/${{ matrix.config }}/voxela
      - run: xvfb-run -a make CONFIG=${{ matrix.config }} graphics-reference play-reference window-reference
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: xvfb-run -a ./build/linux/${{ matrix.config }}/voxela-window --smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [debug, release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            nasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
      - run: make TARGET=windows CONFIG=${{ matrix.config }} all test window
      - run: make TARGET=windows CONFIG=${{ matrix.config }} build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/snapshot.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/save_file.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/player.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/walk_save.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/inventory.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/frame_stats.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/inventory36.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/game36_save.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/container_store.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/containers.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/recipes.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/registry.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/inventory2.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/world2.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/player_options.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/terrain_surface.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/terrain_lod.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/landscape.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/material_assets.py
      - run: /ucrt64/bin/python.exe tests/recipe_book.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/crafting.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/ui_layout.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/game_grid_save.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: /ucrt64/bin/python.exe tests/game_save.py build/windows/${{ matrix.config }}/save_tests.dll
      - run: ./build/windows/${{ matrix.config }}/voxela.exe
      - run: /ucrt64/bin/python.exe tests/packaging.py
      - name: Package standalone Windows viewer
        if: matrix.config == 'release'
        run: >-
          /ucrt64/bin/python.exe tools/package_windows.py
          --viewer build/windows/release/voxela-window.exe
          --headless build/windows/release/voxela.exe
          --dll-dir "$(cygpath -w /ucrt64/bin)"
          --license-dir "$(cygpath -w /ucrt64/share/licenses)"
          --objdump "$(cygpath -w /ucrt64/bin/objdump.exe)"
          --output build/windows/release/package
          --commit "${{ github.sha }}"
      - name: Upload Windows executable package
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: VoxelA-Windows-x64-${{ github.sha }}
          path: build/windows/release/package/
          if-no-files-found: error
          retention-days: 14
